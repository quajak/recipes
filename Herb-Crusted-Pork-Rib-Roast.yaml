---
name: Herb Crusted Pork Rib Roast
source: https://breathingandcooking.com/herb-crusted-pork-rib-roast/
items:
  - 1 Stk 4-10 bone heritage pork rib roast, trimmed and tied
  - Diamond kosher salt
  - Cracked pepper
  - 1/4-1/2 Cup Grainy mustard
  - Fresh rosemary, finely chopped
  - Fresh thyme, finely chopped
recipe: >-
  ## Preparation (1-3 days ahead)

  1. Season the roast generously with kosher salt and cracked pepper (do not use table salt)
  2. Finely chop the fresh herbs and combine with mustard (approximately 1 heaping tablespoon of combined herbs per 1/4 cup mustard)
  3. Smear the herb-mustard mixture thickly over all surfaces—top, sides, bottom, and between ribs
  4. Cover loosely with plastic wrap and refrigerate for 1-3 days

  ## Cooking

  1. Remove roast from refrigerator 1 hour before cooking; place fat-cap side up in cast iron skillet or roasting pan. Preheat oven to 450°F
  2. Insert meat thermometer probe into center. Roast uncovered at 450°F for 15-25 minutes, then reduce to 325°F without opening door
  3. Continue roasting 1.5-2 hours (approximately 15 minutes per pound) until internal temperature reaches 135-140°F
  4. Remove from oven; tent loosely with foil and rest 15-20 minutes before carving. Temperature will rise another 10°F during rest, reaching 145-150°F
