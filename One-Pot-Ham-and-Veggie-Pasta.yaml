---
name: One-Pot Ham and Veggie Pasta
source: AllRecipes
items:
  - 15 ml olive oil
  - 375 g cubed fully cooked ham
  - 120 ml chopped onion
  - 3 Stk garlic cloves, minced
  - 5 ml Italian seasoning
  - 1.25 ml red pepper flakes
  - salt and pepper to taste
  - 950 ml low-sodium chicken broth
  - 300 ml fat free half-and-half
  - 30 g all-purpose flour
  - 450 g farfalle (bow tie) pasta
  - 300 g frozen peas and carrots
  - 50 g grated Parmesan cheese
  - chopped parsley for garnish
recipe: >-
  Heat olive oil in a large pot over medium heat. Add ham and onion; sauté for about 3 minutes. Add garlic and cook until fragrant, about 30 seconds. Stir in Italian seasoning, red pepper flakes, salt and pepper; cook for 2 minutes.

  Whisk together chicken broth, half-and-half, and flour in a bowl until smooth; pour into the pot. Stir in farfalle pasta, cover, and cook for 15 minutes.

  Add peas and carrots. Cook until pasta is cooked through, about 8 more minutes. Stir in Parmesan cheese and garnish with chopped parsley. Serve immediately.
