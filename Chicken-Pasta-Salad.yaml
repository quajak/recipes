---
name: Chicken Pasta Salad
source: Delish
items:
  - 450 g fusilli pasta
  - 450 g boneless skinless chicken breasts
  - 5 ml garlic powder
  - Kosher salt
  - Freshly ground black pepper
  - 15 ml extra-virgin olive oil
  - 4 Stk bacon slices, cooked and crumbled
  - 300 g halved grape tomatoes
  - 60 g spinach, packed
  - 100 g crumbled feta
  - 0.25 medium red onion, thinly sliced
  - 8 g freshly chopped dill
  - 60 ml extra-virgin olive oil
  - 45 ml red wine vinegar
  - 2.5 ml Italian seasoning
  - 1 Stk garlic clove, minced
  - 15 ml dijon mustard
recipe: >-
  In a large pot of salted boiling water, cook fusilli according to package directions until al dente. Drain and transfer to large bowl.

  Season chicken breasts with garlic powder, salt, and pepper. In a large skillet over medium heat, heat oil. Cook chicken until golden and cooked through, 8 minutes per side. Let rest 10 minutes, then cut into 1-inch pieces.

  Meanwhile, make dressing: In a medium bowl, whisk together oil, vinegar, Italian seasoning, garlic, and mustard. Season with salt and pepper.

  In the large bowl with the pasta, toss together all remaining ingredients. Pour dressing over salad, toss until coated, and serve.
